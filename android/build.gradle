plugins {
    id 'com.android.application'
}

def gdxVersion = rootProject.ext.gdxVersion

configurations {
    natives
}

android {
    namespace 'com.spectromancer.port.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.spectromancer.port.android'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '0.1.0-prototype'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"

    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86_64"

    natives "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-x86_64"
}

tasks.register('copyAndroidNatives') {
    doLast {
        def abiByClassifier = [
            'natives-armeabi-v7a': 'armeabi-v7a',
            'natives-arm64-v8a': 'arm64-v8a',
            'natives-x86_64': 'x86_64',
            'natives-x86': 'x86'
        ]
        configurations.natives.files.each { jarFile ->
            def match = abiByClassifier.find { token, abi -> jarFile.name.contains(token) }
            if (match != null) {
                def targetDir = file("libs/${match.value}")
                targetDir.mkdirs()
                copy {
                    from(zipTree(jarFile)) {
                        include '**/*.so'
                        eachFile { details -> details.path = details.name }
                        includeEmptyDirs = false
                    }
                    into targetDir
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyAndroidNatives')
}
