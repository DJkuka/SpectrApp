name: Build native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Test battle engine
        run: |
          if [ -f scripts/test-core.sh ]; then
            sh scripts/test-core.sh
          else
            echo "Test script not found, skipping."
          fi

      - name: Build debug APK
        run: gradle --no-daemon :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectromancer-Native-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
