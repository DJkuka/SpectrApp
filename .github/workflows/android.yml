name: Build native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Test battle engine
        run: sh scripts/test-core.sh

      - name: Build debug APK
        run: gradle --no-daemon :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Spectromancer-Native-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
